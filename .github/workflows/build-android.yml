# Public build check for a native Kotlin/Gradle app: every push, pull request and version tag is built from source on
# GitHub's servers (unit tests + unsigned release APK, no secrets). The SIGNED release files are made on the
# maintainer's computer and attached with `gh release upload`. No repository secrets are needed or used.
name: build-android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tag must match versionName
        if: github.ref_type == 'tag'
        run: |
          v=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)"/\1/')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match versionName v$v"; exit 1; }
      - name: Unit tests and unsigned release APK
        run: |
          sed -i -e '/signingConfig *=/d' app/build.gradle.kts
          printf '\nandroid { dependenciesInfo { includeInApk = false; includeInBundle = false } }\n' >> app/build.gradle.kts
          ./gradlew test assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
